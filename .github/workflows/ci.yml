name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # AGD-26: weekly long-fuzz lane (the longfuzz job below only runs on
    # this event — PR gates keep the 30 s-per-target smoke budgets).
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: "Build (workspace: core + tests)"
        run: go build ./core/... ./tests/...
      - name: Vet
        run: go vet ./core/... ./tests/...
      - name: Test with coverage (unit + fuzz seeds + memory-abuse + e2e)
        run: go test ./core/... ./tests/... -count=1 -coverpkg=github.com/webdevshayan/agent-droid/core/... -coverprofile=coverage.out
      - name: Coverage gate (>= 90% of core)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $3}')
          echo "total coverage: ${total}%"
          if [ -z "$total" ]; then
            echo "could not read the coverage total"; exit 1
          fi
          if awk -v t="$total" 'BEGIN { exit (t+0 >= 90.0) ? 0 : 1 }'; then
            echo "gate passed"
          else
            echo "coverage ${total}% is below the 90% gate"; exit 1
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  race-short:
    # AGD-13: a race lane that fits constrained machines — the memory-abuse
    # phase skips itself under -short (its payloads inflate severalfold
    # under race instrumentation). core.yml runs the full suite with -race
    # on 7 GB runners; this lane makes the race signal cheap and universal.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: "Race detector (short lane: memory-abuse phase skipped)"
        run: go test -race -short -count=1 ./core/... ./tests/...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Fuzz CLI parser
        run: go test ./tests -run '^$' -fuzz FuzzParseArgs -fuzztime 30s
      - name: Fuzz view-tree parser
        run: go test ./tests -run '^$' -fuzz FuzzParseXML -fuzztime 30s
      - name: Fuzz ref parser
        run: go test ./tests -run '^$' -fuzz FuzzParseRef -fuzztime 30s
      - name: Fuzz session view-tree parser
        run: go test ./core/internal/uitree -run '^$' -fuzz FuzzParseTree -fuzztime 30s

  longfuzz:
    # AGD-26: the long budgets behind the fuzzing claim. Runs weekly (see
    # the schedule trigger) and does not gate PRs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Long fuzz (10 minutes per target)
        run: |
          go test ./tests -run '^$' -fuzz FuzzParseArgs -fuzztime 10m
          go test ./tests -run '^$' -fuzz FuzzParseXML -fuzztime 10m
          go test ./tests -run '^$' -fuzz FuzzParseRef -fuzztime 10m
          go test ./core/internal/uitree -run '^$' -fuzz FuzzParseTree -fuzztime 10m

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Fake runtime end-to-end (no adb needed)
        run: |
          set -e
          go build -o /tmp/agentdroid ./core/cmd/agentdroid
          /tmp/agentdroid help > /dev/null
          /tmp/agentdroid --version | grep -q agentdroid
          # The fake launch now stats the APK like every other runtime (AGD-07):
          # hand it a real file.
          printf 'PK\x03\x04 demo payload' > /tmp/demo.apk
          /tmp/agentdroid --runtime fake launch /tmp/demo.apk
          /tmp/agentdroid --runtime fake snapshot | grep -q 'Sign in'
          /tmp/agentdroid --runtime fake tap @e2
          /tmp/agentdroid --runtime fake type 'demo@gmail.com'
          /tmp/agentdroid --runtime fake tap @e3
          /tmp/agentdroid --runtime fake snapshot | grep -q 'Welcome, demo@gmail.com'
          /tmp/agentdroid --runtime fake screenshot > /tmp/screen.png
          test -s /tmp/screen.png
          /tmp/agentdroid --runtime fake close
      - name: Graceful failures without adb
        run: |
          set -e
          # No adb on GitHub runners: device commands must degrade cleanly.
          if /tmp/agentdroid tap @e1 > /dev/null 2>&1; then
            echo "expected failure without adb"; exit 1
          fi
          /tmp/agentdroid tap @e1 2>&1 | grep -q "adb not found"
          /tmp/agentdroid tap @0 2>&1 | grep -q "invalid element ref"
          /tmp/agentdroid frobnicate 2>&1 | grep -q "unknown command"
