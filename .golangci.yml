# AGD-26: the lint workflow's configuration. Conservative by design — the
# codebase's deliberate `_ =` releases and unchecked stdout writes are part
# of the output contract, so errcheck stays off; govet/staticcheck/unused/
# ineffassign carry the signal.
#
# v1 schema (golangci-lint 1.64.x, the version golangci-lint-action v6 runs).
linters:
  disable-all: true
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
